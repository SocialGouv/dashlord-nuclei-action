name: "Nuclei Action"
description: "Nuclei is a fast and customisable vulnerability scanner based on simple YAML based DSL"

inputs:
  url:
    description: URL to scan
    required: true
  output:
    description: "File to save output result"
    required: false
    default: "nuclei.log"
  user-agent:
    description: "Set a User-Agent header"
    required: false
    default: "Nuclei - Open-source project (github.com/projectdiscovery/nuclei)"

runs:
  using: "composite"
  steps:
    - run: |
        if ! [ -x "$(command -v nuclei)" ]; then
          wget -q https://github.com/projectdiscovery/nuclei/releases/download/v3.11.1/nuclei_3.11.1_linux_amd64.zip
          mkdir -p $HOME/.local/nuclei
          unzip -o nuclei_3.11.1_linux_amd64.zip -d $HOME/.local/nuclei
          mkdir -p $HOME/.local/bin
          mv $HOME/.local/nuclei/nuclei $HOME/.local/bin/
          rm -rf $HOME/.local/nuclei
        fi
      shell: bash

    - run: |
        $HOME/.local/bin/nuclei \
          -target ${{ inputs.url }} \
          -json-export ${{ inputs.output }} \
          -header "User-Agent: ${{ inputs.user-agent }}"
      shell: bash
